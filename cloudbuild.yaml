# Builds both images and pushes them to Artifact Registry.
# Used for the first manual build AND by the GitHub Actions CD workflow
# (which passes _TAG=$GITHUB_SHA for immutable, per-commit images).
steps:
  - name: gcr.io/cloud-builders/docker
    id: build-api
    args:
      - build
      - -t
      - ${_AR}/rag-api:${_TAG}
      - -t
      - ${_AR}/rag-api:latest
      - -f
      - Dockerfile
      - .
  - name: gcr.io/cloud-builders/docker
    id: build-ui
    args:
      - build
      - -t
      - ${_AR}/rag-ui:${_TAG}
      - -t
      - ${_AR}/rag-ui:latest
      - -f
      - Dockerfile.ui
      - .

images:
  - ${_AR}/rag-api:${_TAG}
  - ${_AR}/rag-api:latest
  - ${_AR}/rag-ui:${_TAG}
  - ${_AR}/rag-ui:latest

substitutions:
  _AR: us-central1-docker.pkg.dev/ai-storybook-studio-496817/rag
  _TAG: latest

options:
  machineType: E2_HIGHCPU_8
  diskSizeGb: 100

timeout: 3000s
